version: 2
updates:
  # Actions are SHA-pinned; Dependabot bumps the pins and version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    # Generated DataFusion pins must be changed through versions.toml.
    ignore:
      - dependency-name: datafusion
      - dependency-name: datafusion-ffi
      - dependency-name: datafusion-sql

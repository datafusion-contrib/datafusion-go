[package]
name = "datafusion-go"
version = "0.550000.2"
edition = "2024"
rust-version = "1.94"

[lib]
name = "datafusion_go"
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies]
# Use DataFusion's Arrow re-export; datafusion-ffi enables its FFI feature.
# This keeps the bridge on exactly the Arrow version used by DataFusion.
datafusion = "=55.0.0"
datafusion-ffi = "=55.0.0"
datafusion-sql = "=55.0.0"
futures = "0.3"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync"] }
url = "2.5"
sqllogictest = { version = "=0.29.1", optional = true }
serde_json = { version = "1", optional = true }

[dependencies.datafusion-sqllogictest]
version = "=55.0.0"
optional = true
features = ["avro", "parquet_encryption"]

[features]
# Fixtures and callbacks for the Go SQLLogicTest runner. Never enabled in releases.
test-sqllogictest = ["dep:datafusion-sqllogictest", "dep:sqllogictest", "dep:serde_json"]

[dev-dependencies]
indicatif = "0.18"
serde_json = "1"

[workspace]
members = ["fuzz"]
default-members = ["."]
resolver = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
